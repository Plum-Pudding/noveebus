<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoveeBus — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #0d1117; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 420px; }
    .brand-icon { font-size: 3rem; }
  </style>
</head>
<body>
<div class="login-card p-4">
  <div class="text-center mb-4">
    <i class="bi bi-bus-front-fill text-warning brand-icon"></i>
    <h2 class="mt-2 fw-bold">NoveeBus</h2>
    <p class="text-muted small">Employee Transport Management</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-sm">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card border-secondary">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label text-muted small fw-semibold">EMPLOYEE ID</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary"><i class="bi bi-person"></i></span>
            <input type="text" name="employee_id" class="form-control bg-dark border-secondary text-white"
                   placeholder="e.g. emp001" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small fw-semibold">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-white"
                   placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
  <p class="text-center text-muted small mt-3">NoveeBus v1.0 · Transport Management System</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
